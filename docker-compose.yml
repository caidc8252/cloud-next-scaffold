services:
  postgres:
    image: postgres:16
    container_name: cloud-frontend-scaffold-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cloud_frontend}"
      POSTGRES_USER: "${POSTGRES_USER:-cloud}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cloud_dev_password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud} -d ${POSTGRES_DB:-cloud_frontend}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
